<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AREWA WATCH & EARN</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://libtl.com/sdk.js" data-zone="12171277" data-sdk="show_12171277"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      max-width: 420px;
      margin: 20px auto;
      padding: 22px;
      background: #1e293b;
      border-radius: 15px;
    }

    h1 { color: #22c55e; }

    .balance {
      font-size: 30px;
      color: #facc15;
      margin: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 0;
      border-radius: 9px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      background: #64748b;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #64748b;
    }

    #status { color: #facc15; }
  </style>
</head>

<body>

<div class="box">

  <h1>AREWA WATCH & EARN</h1>
  <p>Welcome to our earning platform</p>

  <h3>Your Coin Balance</h3>
  <div class="balance" id="coins">Loading...</div>
  <p id="status">Connecting...</p>

  <button id="watchButton" onclick="watchAd()">
    📺 Watch Ads
  </button>

  <button onclick="dailyBonus()" disabled>
    🎁 Daily Bonus (Coming Soon)
  </button>

  <button onclick="invite()">
    👥 Invite Friends
  </button>

  <hr>

  <h3>TON Wallet</h3>

  <input id="wallet" type="text"
    placeholder="Enter your TON wallet address">

  <button onclick="saveWallet()">
    Save TON Wallet
  </button>

  <button disabled>
    💸 Withdraw (Coming Soon)
  </button>

</div>

<script>

const API = "https://arewawatchearn.abdullahiyaya5555.workers.dev";

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

let adRunning = false;
let cooldownUntil = 0;
let countdownTimer = null;


// AUTHENTICATION HEADERS

function headers() {
  return {
    "Content-Type": "application/json",
    "Authorization": "tma " + tg.initData
  };
}


// LOAD ACCOUNT

async function loadAccount() {

  if (!tg.initData) {
    document.getElementById("coins").textContent = "—";
    document.getElementById("status").textContent =
      "Please open this app inside Telegram.";
    return null;
  }

  try {

    const res = await fetch(API + "/api/me", {
      method: "GET",
      headers: headers()
    });

    const data = await res.json();

    if (!res.ok || !data.success || !data.user) {
      throw new Error(data.error || "Account connection failed");
    }

    const balance = Number(data.user.coins || 0);

    document.getElementById("coins").textContent =
      balance.toLocaleString();

    document.getElementById("wallet").value =
      data.user.ton_wallet || "";

    document.getElementById("status").textContent =
      "Account connected successfully.";

    return balance;

  } catch (error) {

    document.getElementById("coins").textContent = "—";

    document.getElementById("status").textContent =
      "Connection error: " + error.message;

    return null;
  }
}


// COOLDOWN DISPLAY

function updateCooldown() {

  const button = document.getElementById("watchButton");

  const remaining = Math.ceil(
    (cooldownUntil - Date.now()) / 1000
  );

  if (remaining > 0) {

    button.disabled = true;
    button.textContent = "⏳ Next Ad in " + remaining + "s";

  } else {

    clearInterval(countdownTimer);
    countdownTimer = null;

    if (!adRunning) {
      button.disabled = false;
      button.textContent = "📺 Watch Ads";
    }
  }
}


function startCountdown(seconds) {

  cooldownUntil = Date.now() + (Number(seconds) * 1000);

  clearInterval(countdownTimer);

  updateCooldown();

  countdownTimer = setInterval(updateCooldown, 1000);
}


// ASK SERVER FOR PERMISSION

async function startAdPermission() {

  const res = await fetch(API + "/api/start-ad", {
    method: "POST",
    headers: headers()
  });

  const data = await res.json();

  if (res.status === 429) {

    startCountdown(data.remaining || 30);

    document.getElementById("status").textContent =
      "Please wait before watching another ad.";

    return false;
  }

  if (!res.ok || !data.success || !data.allowed) {
    throw new Error(data.error || "Could not start advertisement.");
  }

  return true;
}


// CHECK REWARD FROM SERVER

async function refreshReward(oldBalance) {

  for (let i = 0; i < 10; i++) {

    await new Promise(resolve =>
      setTimeout(resolve, 3000)
    );

    const newBalance = await loadAccount();

    if (
      newBalance !== null &&
      newBalance > oldBalance
    ) {

      document.getElementById("status").textContent =
        "Congratulations! Your reward has arrived.";

      return true;
    }
  }

  document.getElementById("status").textContent =
    "Reward confirmation is pending. Please check again later.";

  return false;
}


// WATCH REWARDED ADS

async function watchAd() {

  if (!tg.initData) {
    alert("Please open the app inside Telegram.");
    return;
  }

  if (adRunning) return;

  if (typeof show_12171277 !== "function") {
    alert("Advertisement is not ready. Please try again.");
    return;
  }

  adRunning = true;

  const button = document.getElementById("watchButton");

  button.disabled = true;
  button.textContent = "Checking...";

  try {

    // CHECK SERVER COOLDOWN

    const permitted = await startAdPermission();

    if (!permitted) return;

    // SAVE CURRENT BALANCE

    const oldBalance =
      Number(
        document.getElementById("coins").textContent.replace(/,/g, "")
      ) || 0;

    // START 30 SECOND SERVER COOLDOWN

    startCountdown(30);

    // UNIQUE AD ID

    const ymid =
      "ad_" + Date.now() + "_" +
      Math.random().toString(36).slice(2, 10);

    document.getElementById("status").textContent =
      "Loading advertisement...";

    // SHOW MONETAG REWARDED AD

    const result = await show_12171277({
      ymid: ymid,
      requestVar: "watch_ads"
    });

    if (result?.reward_event_type === "valued") {

      document.getElementById("status").textContent =
        "Ad completed. Checking reward...";

      await refreshReward(oldBalance);

    } else {

      document.getElementById("status").textContent =
        "No valued reward was confirmed.";

    }

  } catch (error) {

    console.log("Ad error:", error);

    document.getElementById("status").textContent =
      "Advertisement error: " + error.message;

  } finally {

    adRunning = false;

    updateCooldown();

  }
}


// SAVE TON WALLET

async function saveWallet() {

  const wallet =
    document.getElementById("wallet").value.trim();

  if (wallet.length < 20 || wallet.length > 100) {
    alert("Please enter a valid TON wallet address.");
    return;
  }

  try {

    const res = await fetch(API + "/api/ton-wallet", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ wallet })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || "Could not save wallet.");
    }

    alert("TON wallet saved successfully.");

  } catch (error) {

    alert(error.message);

  }
}


// INVITE FRIENDS

function invite() {

  const link = "https://t.me/ArewaWatchEarnBot";

  const text = "Join AREWA WATCH & EARN!";

  tg.openTelegramLink(
    "https://t.me/share/url?url=" +
    encodeURIComponent(link) +
    "&text=" +
    encodeURIComponent(text)
  );
}


// DAILY BONUS

function dailyBonus() {
  alert("Daily Bonus is not active yet.");
}


// IN-APP INTERSTITIAL ADS

let inAppAttempts = 0;

function startInAppAds() {

  if (!tg.initData) return;

  if (typeof show_12171277 !== "function") {

    if (inAppAttempts < 10) {
      inAppAttempts++;
      setTimeout(startInAppAds, 1000);
    }

    return;
  }

  try {

    show_12171277({
      type: "inApp",
      inAppSettings: {
        frequency: 1,
        capping: 0.1,
        interval: 30,
        timeout: 5,
        everyPage: false
      }
    });

  } catch (error) {

    console.log("In-app ad error:", error);

  }
}


// REFRESH ACCOUNT WHEN RETURNING

document.addEventListener("visibilitychange", function() {

  if (!document.hidden) {
    loadAccount();
  }

});


// START APPLICATION

loadAccount();

setTimeout(startInAppAds, 5000);

</script>
</body>
</html>

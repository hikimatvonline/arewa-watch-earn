<script>

const API = "https://arewawatchearn.abdullahiyaya5555.workers.dev";

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

let adRunning = false;
let countdownTimer = null;


// HEADERS

function headers() {
  return {
    "Content-Type": "application/json",
    "Authorization": "tma " + tg.initData
  };
}


// LOAD ACCOUNT

async function loadAccount() {

  if (!tg.initData) {
    document.getElementById("status").textContent =
      "Please open this app inside Telegram.";

    document.getElementById("coins").textContent = "—";
    return null;
  }

  try {
    const res = await fetch(API + "/api/me", {
      method: "GET",
      headers: headers()
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      throw new Error(data.error || "Connection failed");
    }

    document.getElementById("coins").textContent =
      Number(data.user.coins).toLocaleString();

    document.getElementById("wallet").value =
      data.user.ton_wallet || "";

    document.getElementById("status").textContent =
      "Account connected successfully.";

    return Number(data.user.coins);

  } catch (error) {
    document.getElementById("status").textContent =
      "Connection error: " + error.message;

    return null;
  }
}


// COUNTDOWN

function startCountdown(seconds) {

  clearInterval(countdownTimer);

  const button = document.getElementById("watchButton");

  let remaining = Math.max(1, Number(seconds));

  button.disabled = true;

  function update() {

    button.textContent =
      "⏳ Next Ad in " + remaining + "s";

    if (remaining <= 0) {

      clearInterval(countdownTimer);

      button.disabled = false;
      button.textContent = "📺 Watch Ads";

      document.getElementById("status").textContent =
        "You can watch another ad now.";

      return;
    }

    remaining--;
  }

  update();

  countdownTimer = setInterval(update, 1000);
}


// CHECK COOLDOWN ON SERVER

async function startAdPermission() {

  const res = await fetch(API + "/api/start-ad", {
    method: "POST",
    headers: headers()
  });

  const data = await res.json();

  if (res.status === 429) {
    startCountdown(data.remaining || 30);

    document.getElementById("status").textContent =
      "Please wait before watching another ad.";

    return false;
  }

  if (!res.ok || !data.success || !data.allowed) {
    throw new Error(data.error || "Could not start ad.");
  }

  return true;
}


// REFRESH REWARD

async function refreshReward(oldBalance) {

  for (let i = 0; i < 10; i++) {

    await new Promise(resolve =>
      setTimeout(resolve, 3000)
    );

    const newBalance = await loadAccount();

    if (
      newBalance !== null &&
      newBalance > oldBalance
    ) {

      document.getElementById("status").textContent =
        "Reward received successfully!";

      return true;
    }
  }

  document.getElementById("status").textContent =
    "Reward confirmation is pending. Please check again later.";

  return false;
}

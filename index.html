<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AREWA WATCH & EARN</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://libtl.com/sdk.js" data-zone="12171277" data-sdk="show_12171277"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .box {
      max-width: 420px;
      margin: 20px auto;
      padding: 22px;
      background: #1e293b;
      border-radius: 15px;
    }
    h1 { color: #22c55e; }
    .balance {
      font-size: 30px;
      color: #facc15;
      margin: 15px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 0;
      border-radius: 9px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { background: #64748b; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #64748b;
    }
    #status { color: #facc15; }
  </style>
</head>

<body>
  <div class="box">
    <h1>AREWA WATCH & EARN</h1>
    <p>Welcome to our earning platform</p>

    <h3>Your Coin Balance</h3>
    <div class="balance" id="coins">Loading...</div>
    <p id="status">Connecting...</p>

    <button onclick="watchAd()">📺 Watch Ads</button>
    <button onclick="dailyBonus()" disabled>🎁 Daily Bonus (Coming Soon)</button>
    <button onclick="invite()">👥 Invite Friends</button>

    <hr>

    <h3>TON Wallet</h3>
    <input id="wallet" type="text" placeholder="Enter your TON wallet address">
    <button onclick="saveWallet()">Save TON Wallet</button>

    <button disabled>💸 Withdraw (Coming Soon)</button>
  </div>

<script>
const API = "https://arewawatchearn.abdullahiyaya5555.workers.dev";
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

function headers() {
  return {
    "Content-Type": "application/json",
    "Authorization": "tma " + tg.initData
  };
}

async function loadAccount() {
  if (!tg.initData) {
    document.getElementById("status").textContent =
      "Please open this app inside Telegram.";
    document.getElementById("coins").textContent = "—";
    return;
  }

  try {
    const res = await fetch(API + "/api/me", {
      method: "GET",
      headers: headers()
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      throw new Error(data.error || "Connection failed");
    }

    document.getElementById("coins").textContent =
      Number(data.user.coins).toLocaleString();

    document.getElementById("wallet").value =
      data.user.ton_wallet || "";

    document.getElementById("status").textContent =
      "Account connected successfully.";
  } catch (error) {
    document.getElementById("status").textContent =
      "Connection error: " + error.message;
  }
}

function watchAd() {
  if (!tg.initData) {
    alert("Open the app inside Telegram.");
    return;
  }

  if (typeof show_12171277 !== "function") {
    alert("Ad is not ready. Please try again.");
    return;
  }

  const ymid = "ad_" + Date.now() + "_" +
    Math.random().toString(36).slice(2, 10);

  show_12171277({
    ymid: ymid,
    requestVar: "watch_ads"
  }).then(result => {
    if (result?.reward_event_type === "valued") {
      alert("Ad completed. Reward confirmation will be processed by the server.");
    } else {
      alert("No valued reward was confirmed.");
    }
  }).catch(error => {
    console.log(error);
    alert("Ad failed to load. Please try again.");
  });
}

async function saveWallet() {
  const wallet = document.getElementById("wallet").value.trim();

  if (wallet.length < 20 || wallet.length > 100) {
    alert("Please enter a valid TON wallet address.");
    return;
  }

  try {
    const res = await fetch(API + "/api/ton-wallet", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ wallet })
    });

    const data = await res.json();

    if (!res.ok) throw new Error(data.error || "Could not save wallet");

    alert("TON wallet saved successfully.");
  } catch (error) {
    alert(error.message);
  }
}

function invite() {
  const link = "https://t.me/ArewaWatchEarnBot";
  const text = "Join AREWA WATCH & EARN!";
  tg.openTelegramLink(
    "https://t.me/share/url?url=" +
    encodeURIComponent(link) +
    "&text=" + encodeURIComponent(text)
  );
}

function dailyBonus() {
  alert("Daily Bonus is not active yet.");
}

// IN-APP INTERSTITIAL ADS
let inAppAttempts = 0;

function startInAppAds() {
  if (!tg.initData) return;

  if (typeof show_12171277 !== "function") {
    if (inAppAttempts < 10) {
      inAppAttempts++;
      setTimeout(startInAppAds, 1000);
    }
    return;
  }

  try {
    show_12171277({
      type: "inApp",
      inAppSettings: {
        frequency: 1,
        capping: 0.1,
        interval: 30,
        timeout: 5,
        everyPage: false
      }
    });
  } catch (error) {
    console.log("In-app ad error:", error);
  }
}

setTimeout(startInAppAds, 5000);

loadAccount();
</script>
</body>
</html>

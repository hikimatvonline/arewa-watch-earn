<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AREWA WATCH & EARN - Admin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #0b1220;
  color: white;
  font-family: Arial, sans-serif;
}

.header {
  text-align: center;
  margin: 20px 0 30px;
}

.header h2 {
  color: #25d366;
  margin-bottom: 8px;
}

.header p {
  color: #aaa;
}

#status {
  text-align: center;
  margin: 25px 0;
  padding: 15px;
  border-radius: 10px;
  background: #172338;
  color: #ffc857;
  font-size: 14px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.card {
  background: #172338;
  border: 1px solid #263750;
  padding: 20px 12px;
  border-radius: 14px;
  text-align: center;
}

.card h3 {
  font-size: 13px;
  color: #aab8cc;
  margin: 0 0 15px;
}

.number {
  font-size: 25px;
  font-weight: bold;
  color: #25d366;
  overflow-wrap: anywhere;
}

.revenue {
  grid-column: span 2;
}

.revenue .number {
  color: #ffc857;
  font-size: 30px;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #25d366;
  color: #07130b;
  font-size: 16px;
  font-weight: bold;
}

.secondary {
  background: #263750;
  color: white;
}

.footer {
  text-align: center;
  color: #777;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="header">
  <h2>AREWA WATCH & EARN</h2>
  <p>ADMIN DASHBOARD</p>
</div>

<div id="status">Checking admin access...</div>

<div class="grid" id="dashboard" style="display:none">

  <div class="card">
    <h3>Total Users</h3>
    <div class="number" id="users">0</div>
  </div>

  <div class="card">
    <h3>Total Referrals</h3>
    <div class="number" id="referrals">0</div>
  </div>

  <div class="card">
    <h3>Verified Ads</h3>
    <div class="number" id="ads">0</div>
  </div>

  <div class="card">
    <h3>Ad Coins Issued</h3>
    <div class="number" id="adCoins">0</div>
  </div>

  <div class="card">
    <h3>Referral Coins Issued</h3>
    <div class="number" id="referralCoins">0</div>
  </div>

  <div class="card">
    <h3>Total Coins Issued</h3>
    <div class="number" id="totalCoins">0</div>
  </div>

  <div class="card revenue">
    <h3>Estimated Revenue (USD)</h3>
    <div class="number" id="revenue">$0.00</div>
  </div>

</div>

<button onclick="loadDashboard()">🔄 Refresh Dashboard</button>

<button class="secondary" onclick="goBack()">← Back to App</button>

<div class="footer">
  AREWA WATCH & EARN<br>
  Admin Dashboard
</div>

<script>
const API_URL =
"https://arewawatchearn.abdullahiyaya5555.workers.dev";

const statusBox = document.getElementById("status");
const dashboard = document.getElementById("dashboard");

const tg = window.Telegram
  ? window.Telegram.WebApp
  : null;

function showStatus(message, error = false) {
  statusBox.style.display = "block";
  statusBox.style.color = error ? "#ff7777" : "#ffc857";
  statusBox.textContent = message;
}

function getNumber(data, names) {
  for (const name of names) {
    if (data[name] !== undefined && data[name] !== null) {
      return Number(data[name]) || 0;
    }
  }
  return 0;
}

function formatNumber(value) {
  return Number(value).toLocaleString("en-US");
}

async function loadDashboard() {
  dashboard.style.display = "none";

  if (!tg) {
    showStatus(
      "Telegram WebApp was not detected. Please open this page inside your Telegram Mini App.",
      true
    );
    return;
  }

  tg.ready();
  tg.expand();

  const initData = tg.initData;

  if (!initData) {
    showStatus(
      "Telegram authentication data is missing. Please return to the Telegram app and open Admin Dashboard again.",
      true
    );
    return;
  }

  showStatus("Checking admin access...");

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);

  try {
    const response = await fetch(
      API_URL + "/api/admin/stats",
      {
        method: "GET",
        headers: {
          "Authorization": "tma " + initData
        },
        signal: controller.signal
      }
    );

    clearTimeout(timeout);

    const rawText = await response.text();

    let result;

    try {
      result = JSON.parse(rawText);
    } catch {
      throw new Error(
        "Worker returned an invalid response. HTTP " +
        response.status
      );
    }

    if (!response.ok) {
      throw new Error(
        result.error ||
        result.message ||
        "HTTP error " + response.status
      );
    }

    if (result.ok === false || result.success === false) {
      throw new Error(
        result.error ||
        result.message ||
        "Admin access denied"
      );
    }

    const data =
      result.stats ||
      result.data ||
      result;

    document.getElementById("users").textContent =
      formatNumber(getNumber(data, [
        "totalUsers",
        "total_users",
        "users"
      ]));

    document.getElementById("referrals").textContent =
      formatNumber(getNumber(data, [
        "totalReferrals",
        "total_referrals",
        "referrals"
      ]));

    document.getElementById("ads").textContent =
      formatNumber(getNumber(data, [
        "verifiedAds",
        "verified_ads",
        "totalAds",
        "total_ads"
      ]));

    document.getElementById("adCoins").textContent =
      formatNumber(getNumber(data, [
        "adCoinsIssued",
        "ad_coins_issued",
        "adCoins"
      ]));

    document.getElementById("referralCoins").textContent =
      formatNumber(getNumber(data, [
        "referralCoinsIssued",
        "referral_coins_issued",
        "referralCoins"
      ]));

    document.getElementById("totalCoins").textContent =
      formatNumber(getNumber(data, [
        "totalCoinsIssued",
        "total_coins_issued",
        "totalCoins"
      ]));

    const revenue = getNumber(data, [
      "estimatedRevenueUSD",
      "estimated_revenue_usd",
      "estimatedRevenue",
      "estimated_revenue"
    ]);

    document.getElementById("revenue").textContent =
      "$" + revenue.toFixed(6);

    statusBox.style.display = "none";
    dashboard.style.display = "grid";

  } catch (error) {
    clearTimeout(timeout);

    if (error.name === "AbortError") {
      showStatus(
        "Connection timed out. Please check your internet and try again.",
        true
      );
    } else {
      showStatus(
        "Dashboard Error: " + error.message,
        true
      );
    }

    console.error("Admin Dashboard Error:", error);
  }
}

function goBack() {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = "./index.html";
  }
}

loadDashboard();
</script>

</body>
</html>
